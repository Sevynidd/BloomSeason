  </g>
  <text id="title" x="20" y="104" font-size="15">Sommer · Tag 15</text>
  <text id="headline" x="20" y="140" font-size="32" font-weight="700">in 10–18 Tagen</text>
  <text id="sub" x="20" y="159" font-size="14">nächste Periode</text>
  <text id="window" x="20" y="177" font-size="13">voraussichtlich 14.–22. November</text>
