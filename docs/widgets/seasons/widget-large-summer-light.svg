      <line x1="32" y1="9" x2="32" y2="15" transform="rotate(135 32 32)" stroke="#7A5B0F" stroke-width="3" stroke-linecap="round"/>
      <line x1="32" y1="9" x2="32" y2="15" transform="rotate(180 32 32)" stroke="#7A5B0F" stroke-width="3" stroke-linecap="round"/>
      <line x1="32" y1="9" x2="32" y2="15" transform="rotate(225 32 32)" stroke="#7A5B0F" stroke-width="3" stroke-linecap="round"/>
      <line x1="32" y1="9" x2="32" y2="15" transform="rotate(270 32 32)" stroke="#7A5B0F" stroke-width="3" stroke-linecap="round"/>
