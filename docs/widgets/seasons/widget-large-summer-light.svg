      <rect id="summer" x="159.3" y="203" width="32.1" height="16" fill="#7A5B0F"/>
      <rect id="autumn" x="191.4" y="203" width="128.6" height="16" fill="#9B4A28"/>
    </g>
    <circle id="today-ring" cx="175.4" cy="211" r="9" fill="#F4E3B8"/>
