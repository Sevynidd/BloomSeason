<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="960" viewBox="0 0 1160 960" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
<rect id="page-light" width="580" height="960" fill="#F5F1EB"/>
<rect id="page-dark" x="580" width="580" height="960" fill="#121110"/>
<text x="40" y="44" font-size="18" font-weight="700" fill="#1E1B18">Hell</text>
<text x="620" y="44" font-size="18" font-weight="700" fill="#ECE7E1">Dunkel</text>
<g id="widget-compact-light-spring" transform="translate(40 70)" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#11290F">
  <rect id="background" width="160" height="160" rx="28" fill="#D6EACD"/>
  <text id="season" x="80" y="59" font-size="13" text-anchor="middle">Frühling</text>
  <text id="number" x="80" y="96" font-size="30" font-weight="700" text-anchor="middle">18–26</text>
  <text id="unit" x="80" y="115" font-size="12" text-anchor="middle">Tage bis zur Periode</text>
</g>
<g id="widget-medium-light-spring" transform="translate(230 70)" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#11290F">
