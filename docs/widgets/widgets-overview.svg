  <text id="window" x="20" y="153" font-size="13">voraussichtlich 21.–29. November</text>
  <g id="year-bar">
    <clipPath id="bar-clip-light-spring"><rect x="20" y="167" width="300" height="16" rx="8"/></clipPath>
